<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WG_Game</title>
<style>
  :root{
    --purple:#8e7cff; --pink:#ff8fab; --bg:#f6f5ff; --card:#ffffff;
    --text:#2d2a45; --muted:#8b88a3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(160deg,var(--bg),#eef1ff 60%,#fff1f7);
    color:var(--text); padding:20px; display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-size:30px; margin:16px 0 4px; text-align:center; }
  .sub{ font-size:14px; color:var(--muted); margin-bottom:32px; text-align:center; }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:20px; max-width:720px; width:100%;
  }
  .gameCard{
    background:var(--card); border-radius:22px; padding:30px 22px; text-align:center;
    text-decoration:none; color:var(--text); box-shadow:0 4px 14px rgba(0,0,0,.08);
    transition:transform .2s, box-shadow .2s; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .gameCard:hover{ transform:translateY(-4px); box-shadow:0 8px 22px rgba(0,0,0,.14); }
  .gameCard .emoji{ font-size:52px; }
  .gameCard h2{ font-size:19px; margin:4px 0 2px; }
  .gameCard p{ font-size:13px; color:var(--muted); margin:0; line-height:1.5; }
  .comingSoon{
    background:#f3f2fb; border-radius:22px; padding:30px 22px; text-align:center;
    color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:10px;
    border:2px dashed #ddd9f5;
  }
  .comingSoon .emoji{ font-size:44px; opacity:.6; }
  .comingSoon h2{ font-size:16px; margin:4px 0 2px; }
  .comingSoon p{ font-size:13px; margin:0; }
  footer{ margin-top:36px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>

<h1>🎮 WG_Game</h1>
<div class="sub">小朋友的學習遊戲基地</div>

<div class="grid">
  <a class="gameCard" href="games/abc-phonics/index.html">
    <div class="emoji">🔤</div>
    <h2>ABC 字母 × 注音遊戲</h2>
    <p>翻牌配對、單字卡、ㄅㄆㄇ聽力挑戰、闖關收集地圖</p>
  </a>
  <div class="comingSoon">
    <div class="emoji">✨</div>
    <h2>更多遊戲</h2>
    <p>陸續開發中</p>
  </div>
</div>

<footer>WG_Game</footer>

</body>
</html>
