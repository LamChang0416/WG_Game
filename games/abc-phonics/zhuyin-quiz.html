<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ㄅㄆㄇ 聽力挑戰</title>
<script src="https://unpkg.com/pinyin-pro@3.28.2/dist/index.js"></script>
<script src="words-data.js"></script>
<script src="../../shared/zhuyin-render.js"></script>
<style>
  :root{
    --purple:#8e7cff; --pink:#ff8fab; --bg:#f6f5ff; --card:#ffffff;
    --text:#2d2a45; --muted:#8b88a3; --green:#4cd07d; --red:#ff8a80; --gold:#ffc94a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(160deg,var(--bg),#eef1ff 60%,#fff1f7);
    color:var(--text); padding:20px; display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-size:22px; margin:4px 0 2px; text-align:center; }
  .sub{ font-size:14px; color:var(--muted); margin-bottom:14px; text-align:center; max-width:420px; }
  .progress{
    font-size:15px; font-weight:700; color:var(--purple); margin-bottom:16px;
    background:#fff; padding:8px 18px; border-radius:999px; box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .letterTabs{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; max-width:640px; }
  .letterTab{
    padding:8px 16px; border-radius:999px; border:none; font-size:16px; font-weight:800;
    cursor:pointer; background:#fff; color:var(--purple); box-shadow:0 2px 8px rgba(0,0,0,.08);
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .letterTab.active{ background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff; }
  .stage{
    background:#fff; border-radius:22px; padding:26px; max-width:440px; width:100%;
    box-shadow:0 6px 20px rgba(0,0,0,.10); text-align:center;
  }
  .stage img{ width:110px; height:110px; object-fit:contain; margin-bottom:6px; }
  .replayBtn{
    border:none; background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff;
    padding:10px 20px; border-radius:999px; font-size:15px; font-weight:700; cursor:pointer;
    margin-bottom:20px; box-shadow:0 3px 8px rgba(0,0,0,.15);
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .options{ display:flex; flex-direction:column; gap:12px; }
  .option{
    border:3px solid #e8e6fb; background:#faf9ff; border-radius:16px; padding:14px;
    cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center;
    min-height:64px; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .option.correct{ border-color:var(--green); background:#eafff2; }
  .option.wrong{ border-color:var(--red); background:#fff0ee; opacity:.55; }
  .option.disabled{ pointer-events:none; }
  .option.shake{ animation:shake .35s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); }
  }

  #celebrate{
    position:fixed; inset:0; background:rgba(45,42,69,.55); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  #celebrate .box{
    background:#fff; border-radius:24px; padding:36px 30px; text-align:center; max-width:340px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  #celebrate .emoji{ font-size:56px; }
  #celebrate h2{ margin:10px 0 6px; color:var(--purple); }
  #celebrate p{ color:var(--muted); margin:0 0 18px; }
  .btn{
    padding:12px 24px; border-radius:12px; border:none; font-weight:800; font-size:15px;
    cursor:pointer; background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .confetti{ position:absolute; font-size:22px; animation:fall 1.6s ease-in forwards; }
  @keyframes fall{
    0%{ transform:translateY(-20px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(420px) rotate(360deg); opacity:0; }
  }
  footer{ margin-top:22px; font-size:12px; color:var(--muted); text-align:center; }
  .hubLink{ align-self:flex-start; font-size:13px; color:var(--muted); text-decoration:none; margin-bottom:8px; }
</style>
</head>
<body>

<a class="hubLink" href="index.html">← 選單</a>

<h1>👂 ㄅㄆㄇ 聽力挑戰</h1>
<div class="sub">聽中文語音，選出正確的注音 — 這一關要真的認得注音符號，比翻牌配對更需要主動判斷喔</div>

<div class="letterTabs" id="letterTabs"></div>
<div class="progress"><span id="progressText">1 / 3</span> 🌟 答對 <span id="scoreText">0</span> 次</div>

<div class="stage">
  <img id="stageImg" src="" alt="">
  <div><button class="replayBtn" id="replayBtn">🔊 再聽一次</button></div>
  <div class="options" id="options"></div>
</div>

<div id="celebrate">
  <div class="box">
    <div class="emoji">🎉</div>
    <h2>太棒了！全部都聽對了！</h2>
    <p id="celebrateScore"></p>
    <button class="btn" id="replayQuizBtn">再玩一次</button>
  </div>
</div>

<footer>ABC 字母 × 注音遊戲 · WG_Game</footer>

<script>
/* ---- 拆解/重組單一注音音節，供產生「近似但錯誤」的干擾選項使用 ---- */
var TONE_MARK_CHARS = { 'ˊ':1, 'ˇ':1, 'ˋ':1 };
var LIGHT_TONE_CHAR = '˙';
function parseZhuyinSyllable(zy) {
  if (!zy) return null;
  var chars = Array.from(zy).filter(function (c) { return c.trim() !== ''; });
  if (!chars.length) return null;
  var light = false, tone = null;
  if (chars[0] === LIGHT_TONE_CHAR) { light = true; chars = chars.slice(1); }
  else if (chars[chars.length - 1] === LIGHT_TONE_CHAR) { light = true; chars = chars.slice(0, -1); }
  else if (TONE_MARK_CHARS[chars[chars.length - 1]]) { tone = chars[chars.length - 1]; chars = chars.slice(0, -1); }
  return { letters: chars, tone: tone, light: light };
}
function serializeZhuyinSyllable(parsed) {
  if (!parsed) return '';
  if (parsed.light) return LIGHT_TONE_CHAR + parsed.letters.join('');
  return parsed.letters.join('') + (parsed.tone || '');
}
var CONFUSABLE_MAP = {
  'ㄅ':'ㄆ','ㄆ':'ㄅ', 'ㄉ':'ㄊ','ㄊ':'ㄉ', 'ㄍ':'ㄎ','ㄎ':'ㄍ',
  'ㄓ':'ㄗ','ㄗ':'ㄓ', 'ㄔ':'ㄘ','ㄘ':'ㄔ', 'ㄕ':'ㄙ','ㄙ':'ㄕ',
  'ㄋ':'ㄌ','ㄌ':'ㄋ', 'ㄈ':'ㄏ','ㄏ':'ㄈ',
  'ㄣ':'ㄥ','ㄥ':'ㄣ', 'ㄢ':'ㄤ','ㄤ':'ㄢ',
  'ㄒ':'ㄑ','ㄑ':'ㄒ'
};
var TONE_CYCLE = ['', 'ˊ', 'ˇ', 'ˋ'];

function pairsSignature(pairs) {
  return pairs.map(function (p) { return p[0] + '|' + p[1]; }).join(',');
}

function makeDistractor(basePairs, correctSig, usedSigs) {
  for (var attempt = 0; attempt < 30; attempt++) {
    var candidateIdxs = [];
    basePairs.forEach(function (p, i) { if (p[1]) candidateIdxs.push(i); });
    if (!candidateIdxs.length) return null;
    var idx = candidateIdxs[Math.floor(Math.random() * candidateIdxs.length)];
    var parsed = parseZhuyinSyllable(basePairs[idx][1]);
    if (!parsed) continue;
    var mode = Math.random() < 0.5 ? 'consonant' : 'tone';
    var mutated = { letters: parsed.letters.slice(), tone: parsed.tone, light: parsed.light };

    if (mode === 'consonant') {
      var swapPos = -1;
      for (var i = 0; i < mutated.letters.length; i++) {
        if (CONFUSABLE_MAP[mutated.letters[i]]) { swapPos = i; break; }
      }
      if (swapPos === -1) continue;
      mutated.letters[swapPos] = CONFUSABLE_MAP[mutated.letters[swapPos]];
    } else {
      var current = mutated.light ? '˙' : (mutated.tone || '');
      var options = TONE_CYCLE.filter(function (t) { return t !== current; });
      mutated.tone = options[Math.floor(Math.random() * options.length)] || null;
      mutated.light = false;
    }

    var newPairs = basePairs.map(function (p) { return [p[0], p[1]]; });
    newPairs[idx][1] = serializeZhuyinSyllable(mutated);
    var sig = pairsSignature(newPairs);
    if (sig !== correctSig && usedSigs.indexOf(sig) === -1) {
      return newPairs;
    }
  }
  return null;
}

function buildOptions(word) {
  var correctPairs = generateZhuyinPairs(word.zh).pairs;
  var correctSig = pairsSignature(correctPairs);
  var options = [{ pairs: correctPairs, correct: true }];
  var usedSigs = [correctSig];
  while (options.length < 3) {
    var d = makeDistractor(correctPairs, correctSig, usedSigs);
    if (!d) break; // 找不到更多干擾項就用手上有的（至少會有正確答案）
    options.push({ pairs: d, correct: false });
    usedSigs.push(pairsSignature(d));
  }
  return shuffle(options);
}

/* ---- 遊戲資料（來自 words-data.js，每次只玩一個字母的 3 個單字）---- */
var currentLetter = 'A';
var quizOrder = [];
var currentIdx = 0;
var score = 0;

function renderLetterTabs() {
  var wrap = document.getElementById('letterTabs');
  wrap.innerHTML = '';
  ABC_ALL_LETTERS.forEach(function (letter) {
    var btn = document.createElement('button');
    btn.className = 'letterTab' + (letter === currentLetter ? ' active' : '');
    btn.textContent = letter;
    btn.addEventListener('click', function () {
      currentLetter = letter;
      renderLetterTabs();
      startQuiz();
    });
    wrap.appendChild(btn);
  });
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function playAudio(src) {
  var a = new Audio(src);
  a.playbackRate = 0.9;
  a.play().catch(function () {});
  return a;
}

function startQuiz() {
  quizOrder = shuffle(ABC_WORDS_BY_LETTER[currentLetter]);
  currentIdx = 0;
  score = 0;
  document.getElementById('celebrate').style.display = 'none';
  renderQuestion();
}

function renderQuestion() {
  var word = quizOrder[currentIdx];
  document.getElementById('progressText').textContent = (currentIdx + 1) + ' / ' + quizOrder.length;
  document.getElementById('scoreText').textContent = score;
  document.getElementById('stageImg').src = word.img;
  document.getElementById('stageImg').alt = word.en;

  var options = buildOptions(word);
  var optionsWrap = document.getElementById('options');
  optionsWrap.innerHTML = '';
  options.forEach(function (opt) {
    var btn = document.createElement('div');
    btn.className = 'option';
    btn.innerHTML = renderZhuyinText(opt.pairs, { hanziSize: 46, ratio: 0.34 });
    btn.addEventListener('click', function () { onOptionClick(opt, btn, word); });
    optionsWrap.appendChild(btn);
  });

  playAudio('audio/words/' + word.id + '_zh.mp3');
}

function onOptionClick(opt, btn, word) {
  if (btn.classList.contains('disabled')) return;
  if (opt.correct) {
    document.querySelectorAll('.option').forEach(function (o) { o.classList.add('disabled'); });
    btn.classList.add('correct');
    score++;
    playAudio('audio/words/' + word.id + '_zh.mp3');
    setTimeout(function () {
      currentIdx++;
      if (currentIdx >= quizOrder.length) {
        showCelebration();
      } else {
        renderQuestion();
      }
    }, 1200);
  } else {
    btn.classList.add('wrong', 'disabled', 'shake');
    setTimeout(function () { btn.classList.remove('shake'); }, 350);
  }
}

document.getElementById('replayBtn').addEventListener('click', function () {
  var word = quizOrder[currentIdx];
  playAudio('audio/words/' + word.id + '_zh.mp3');
});

function showCelebration() {
  document.getElementById('celebrateScore').textContent = '答對 ' + score + ' / ' + quizOrder.length + ' 題';
  var overlay = document.getElementById('celebrate');
  overlay.style.display = 'flex';
  var emojis = ['🎉','⭐','🌈','🎈','✨'];
  for (var i = 0; i < 18; i++) {
    (function () {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = Math.random() * 100 + '%';
      c.style.top = '-20px';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      overlay.appendChild(c);
      setTimeout(function () { c.remove(); }, 2200);
    })();
  }
}

document.getElementById('replayQuizBtn').addEventListener('click', startQuiz);

renderLetterTabs();
startQuiz();
</script>
</body>
</html>
