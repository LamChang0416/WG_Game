<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC 翻牌配對遊戲</title>
<script src="words-data.js"></script>
<script src="../../shared/zhuyin-render.js"></script>
<style>
  :root{
    --purple:#8e7cff; --pink:#ff8fab; --bg:#f6f5ff; --card:#ffffff;
    --text:#2d2a45; --muted:#8b88a3; --green:#4cd07d; --gold:#ffc94a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(160deg,var(--bg),#eef1ff 60%,#fff1f7);
    color:var(--text); padding:20px; display:flex; flex-direction:column; align-items:center;
  }
  h1{font-size:22px; margin:4px 0 2px; text-align:center;}
  .sub{font-size:14px; color:var(--muted); margin-bottom:14px; text-align:center;}
  .progress{
    font-size:15px; font-weight:700; color:var(--purple); margin-bottom:16px;
    background:#fff; padding:8px 18px; border-radius:999px; box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .letterTabs{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; max-width:640px; }
  .letterTab{
    padding:8px 16px; border-radius:999px; border:none; font-size:16px; font-weight:800;
    cursor:pointer; background:#fff; color:var(--purple); box-shadow:0 2px 8px rgba(0,0,0,.08);
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .letterTab.active{ background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff; }
  .board{
    display:grid; grid-template-columns:repeat(4, minmax(125px,150px));
    gap:14px; max-width:680px; width:100%; justify-content:center;
  }
  .card{
    position:relative; aspect-ratio:3/4; cursor:pointer; perspective:800px;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .card-inner{
    position:relative; width:100%; height:100%; transition:transform .5s;
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .card.matched .card-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    box-shadow:0 3px 10px rgba(0,0,0,.10);
  }
  .face-back{
    background:linear-gradient(135deg,var(--purple),var(--pink));
    font-size:34px;
  }
  .face-front{
    background:var(--card); transform:rotateY(180deg); padding:8px; text-align:center;
    border:3px solid transparent;
  }
  .card.matched .face-front{ border-color:var(--green); }
  .card.wrong .card-inner{ animation:shake .4s; }
  @keyframes shake{
    0%,100%{ transform:rotateY(180deg) translateX(0); }
    25%{ transform:rotateY(180deg) translateX(-6px); }
    75%{ transform:rotateY(180deg) translateX(6px); }
  }
  .card.matched{ animation:pop .4s ease; }
  @keyframes pop{
    0%{ transform:scale(1); } 50%{ transform:scale(1.12); } 100%{ transform:scale(1); }
  }
  .img-face img{ width:70%; max-height:65%; object-fit:contain; }
  .word-en{ font-size:17px; font-weight:800; color:var(--purple); margin-top:2px; }
  .word-zh{ margin-top:6px; }
  .star-badge{
    position:absolute; top:-8px; right:-8px; background:var(--gold); border-radius:50%;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    font-size:15px; box-shadow:0 2px 6px rgba(0,0,0,.15); transform:rotateY(180deg);
  }
  .letter-tag{
    position:absolute; top:4px; left:6px; font-size:11px; font-weight:700; color:#fff;
    background:var(--purple); border-radius:6px; padding:1px 6px; opacity:.85; transform:rotateY(180deg);
  }
  #celebrate{
    position:fixed; inset:0; background:rgba(45,42,69,.55); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  #celebrate .box{
    background:#fff; border-radius:24px; padding:36px 30px; text-align:center; max-width:340px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  #celebrate .emoji{ font-size:56px; }
  #celebrate h2{ margin:10px 0 6px; color:var(--purple); }
  #celebrate p{ color:var(--muted); margin:0 0 18px; }
  .btn{
    padding:12px 24px; border-radius:12px; border:none; font-weight:800; font-size:15px;
    cursor:pointer; background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  #startScreen{
    position:fixed; inset:0; background:linear-gradient(160deg,var(--bg),#eef1ff 60%,#fff1f7);
    display:flex; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  #startScreen .box{
    background:#fff; border-radius:24px; padding:40px 30px; text-align:center; max-width:340px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
  }
  #startScreen .emoji{ font-size:60px; }
  #startScreen h2{ margin:10px 0 6px; color:var(--purple); }
  #startScreen p{ color:var(--muted); margin:0 0 20px; font-size:14px; }
  #startScreen .btn{ font-size:18px; padding:16px 32px; }

  @media (max-width:480px){
    body{ padding:12px; }
    h1{ font-size:18px; }
    .sub{ font-size:12px; }
    .board{ grid-template-columns:repeat(2, minmax(130px,1fr)); gap:12px; max-width:340px; }
    .word-en{ font-size:16px; }
    .face-back{ font-size:26px; }
    .letter-tag{ font-size:10px; }
    .star-badge{ width:22px; height:22px; font-size:12px; }
  }
  .confetti{
    position:absolute; font-size:22px; animation:fall 1.6s ease-in forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(-20px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(420px) rotate(360deg); opacity:0; }
  }
  footer{ margin-top:22px; font-size:12px; color:var(--muted); text-align:center; }
  .hubLink{ align-self:flex-start; font-size:13px; color:var(--muted); text-decoration:none; margin-bottom:8px; }
</style>
</head>
<body>

<a class="hubLink" href="index.html">← 選單</a>

<div id="startScreen">
  <div class="box">
    <div class="emoji">🃏</div>
    <h2>翻牌配對遊戲</h2>
    <p>找出圖片跟單字的好朋友，配對成功會念出來喔！</p>
    <button class="btn" id="startBtn">▶️ 點我開始</button>
  </div>
</div>

<h1>🃏 翻牌配對：找出圖片跟單字的好朋友！</h1>
<div class="sub">選一個字母 — 翻兩張卡，圖片跟單字配對成功就會念出來喔！</div>

<div class="letterTabs" id="letterTabs"></div>
<div class="progress">配對進度：<span id="progressText">0 / 3</span> 🌟</div>

<div class="board" id="board"></div>

<div id="celebrate">
  <div class="box">
    <div class="emoji">🎉</div>
    <h2>太棒了！全部配對成功！</h2>
    <p id="celebrateText">這個字母的單字你都記住囉！</p>
    <button class="btn" id="replayBtn">再玩一次</button>
  </div>
</div>

<footer>ABC 字母 × 注音遊戲 · WG_Game</footer>

<script>
/* ---- 遊戲資料（來自 words-data.js） ---- */
var currentLetter = 'A';
var WORDS = ABC_WORDS_BY_LETTER[currentLetter];

var board = document.getElementById('board');
var progressText = document.getElementById('progressText');
var flipped = [];
var matchedCount = 0;
var locked = false;

function renderLetterTabs() {
  var wrap = document.getElementById('letterTabs');
  wrap.innerHTML = '';
  ABC_ALL_LETTERS.forEach(function (letter) {
    var btn = document.createElement('button');
    btn.className = 'letterTab' + (letter === currentLetter ? ' active' : '');
    btn.textContent = letter;
    btn.addEventListener('click', function () {
      currentLetter = letter;
      WORDS = ABC_WORDS_BY_LETTER[currentLetter];
      renderLetterTabs();
      renderBoard();
    });
    wrap.appendChild(btn);
  });
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var REWARD_PLAYBACK_RATE = 0.9; // 語音播放速度，0.9 = 稍慢一點，方便小朋友聽清楚

function playAudio(src) {
  var a = new Audio(src);
  a.playbackRate = REWARD_PLAYBACK_RATE;
  a.play().catch(function () { /* 自動播放被擋就略過，不影響遊戲 */ });
  return a;
}

// 手機/平板瀏覽器要求「使用者手勢」後才能播放音效，
// 在開始畫面按鈕點擊當下先播一次（靜音）解鎖，之後遊戲中的音效才能正常自動播放
function unlockAudioForMobile() {
  var a = new Audio(WORDS[0] ? 'audio/words/' + WORDS[0].id + '_en.mp3' : '');
  a.volume = 0;
  a.play().then(function () { a.pause(); }).catch(function () {});
}

function speakPairReward(word) {
  var en = playAudio('audio/words/' + word.id + '_en.mp3');
  en.addEventListener('ended', function () {
    playAudio('audio/words/' + word.id + '_zh.mp3');
  });
}

function makeCardEl(card) {
  var el = document.createElement('div');
  el.className = 'card';
  el.dataset.matchId = card.matchId;
  el.dataset.kind = card.kind;

  var inner = document.createElement('div');
  inner.className = 'card-inner';

  var back = document.createElement('div');
  back.className = 'face face-back';
  back.textContent = '❓';

  var front = document.createElement('div');
  front.className = 'face face-front';

  var tag = document.createElement('div');
  tag.className = 'letter-tag';
  tag.textContent = card.word.letter;
  front.appendChild(tag);

  if (card.kind === 'image') {
    front.classList.add('img-face');
    var img = document.createElement('img');
    img.src = card.word.img;
    img.alt = card.word.en;
    front.appendChild(img);
  } else {
    var enEl = document.createElement('div');
    enEl.className = 'word-en';
    enEl.textContent = card.word.en;
    var zhEl = document.createElement('div');
    zhEl.className = 'word-zh';
    zhEl.innerHTML = renderZhuyinText(card.word.zy, { hanziSize: 46, ratio: 0.34 });
    front.appendChild(enEl);
    front.appendChild(zhEl);
  }

  var star = document.createElement('div');
  star.className = 'star-badge';
  star.textContent = '⭐';
  star.style.display = 'none';
  front.appendChild(star);

  inner.appendChild(back);
  inner.appendChild(front);
  el.appendChild(inner);

  el.addEventListener('click', function () { onCardClick(el, card); });
  return el;
}

function buildDeck() {
  var deck = [];
  WORDS.forEach(function (w) {
    deck.push({ kind: 'image', matchId: w.id, word: w });
    deck.push({ kind: 'word', matchId: w.id, word: w });
  });
  return shuffle(deck);
}

function renderBoard() {
  board.innerHTML = '';
  flipped = [];
  matchedCount = 0;
  locked = false;
  progressText.textContent = '0 / ' + WORDS.length;
  var deck = buildDeck();
  deck.forEach(function (card) { board.appendChild(makeCardEl(card)); });
}

function onCardClick(el, card) {
  if (locked) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flipped.length === 2) return;

  el.classList.add('flipped');
  flipped.push({ el: el, card: card });

  if (flipped.length === 2) {
    locked = true;
    var a = flipped[0], b = flipped[1];
    var isMatch = a.card.matchId === b.card.matchId && a.card.kind !== b.card.kind;
    if (isMatch) {
      setTimeout(function () {
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        a.el.querySelector('.star-badge').style.display = 'flex';
        b.el.querySelector('.star-badge').style.display = 'flex';
        matchedCount++;
        progressText.textContent = matchedCount + ' / ' + WORDS.length;
        speakPairReward(a.card.word);
        flipped = [];
        locked = false;
        if (matchedCount === WORDS.length) {
          setTimeout(showCelebration, 900);
        }
      }, 350);
    } else {
      a.el.classList.add('wrong');
      b.el.classList.add('wrong');
      setTimeout(function () {
        a.el.classList.remove('flipped', 'wrong');
        b.el.classList.remove('flipped', 'wrong');
        flipped = [];
        locked = false;
      }, 900);
    }
  }
}

function showCelebration() {
  document.getElementById('celebrateText').textContent = currentLetter + ' 的單字你都記住囉！';
  var overlay = document.getElementById('celebrate');
  overlay.style.display = 'flex';
  var emojis = ['🎉','⭐','🌈','🎈','✨'];
  for (var i = 0; i < 18; i++) {
    (function () {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = Math.random() * 100 + '%';
      c.style.top = '-20px';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      overlay.appendChild(c);
      setTimeout(function () { c.remove(); }, 2200);
    })();
  }
}

document.getElementById('replayBtn').addEventListener('click', function () {
  document.getElementById('celebrate').style.display = 'none';
  renderBoard();
});

document.getElementById('startBtn').addEventListener('click', function () {
  document.getElementById('startScreen').style.display = 'none';
  unlockAudioForMobile();
  renderLetterTabs();
  renderBoard();
});
</script>
</body>
</html>
