<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC 闖關收集地圖</title>
<script src="https://unpkg.com/pinyin-pro@3.28.2/dist/index.js"></script>
<script src="words-data.js"></script>
<script src="../../shared/zhuyin-render.js"></script>
<style>
  :root{
    --purple:#8e7cff; --pink:#ff8fab; --bg:#f6f5ff; --card:#ffffff;
    --text:#2d2a45; --muted:#8b88a3; --green:#4cd07d; --gold:#ffc94a; --lock:#c9c6de;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(160deg,var(--bg),#eef1ff 60%,#fff1f7);
    color:var(--text); padding:20px; display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-size:22px; margin:4px 0 2px; text-align:center; }
  .sub{ font-size:14px; color:var(--muted); margin-bottom:16px; text-align:center; max-width:420px; }

  /* ---- 地圖畫面 ---- */
  #mapView{ width:100%; max-width:560px; }
  .mapGrid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(70px,1fr)); gap:12px;
    background:#fff; border-radius:20px; padding:20px; box-shadow:0 6px 20px rgba(0,0,0,.08);
  }
  .node{
    aspect-ratio:1; border-radius:50%; border:none; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-weight:800; font-size:18px; cursor:pointer;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; position:relative;
  }
  .node.unlocked{ background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff; box-shadow:0 4px 10px rgba(142,124,255,.4); }
  .node.completed{ background:var(--green); color:#fff; box-shadow:0 4px 10px rgba(76,208,125,.4); }
  .node.locked{ background:var(--lock); color:#fff; cursor:default; opacity:.7; }
  .node .badge{ position:absolute; top:-4px; right:-4px; font-size:14px; }
  .node.pulse{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }

  .albumTitle{ font-size:14px; color:var(--muted); margin:20px 0 8px; text-align:center; }
  .album{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center; background:#fff;
    border-radius:16px; padding:14px; box-shadow:0 4px 14px rgba(0,0,0,.06);
  }
  .albumSlot{
    width:64px; height:64px; border-radius:12px; background:#f3f2fb; display:flex;
    align-items:center; justify-content:center; overflow:hidden; border:2px dashed #ddd9f5;
  }
  .albumSlot img{ width:100%; height:100%; object-fit:contain; }
  .albumSlot.empty{ font-size:22px; color:#ddd9f5; }

  .resetBtn{
    margin-top:20px; background:none; border:none; color:var(--muted); font-size:13px;
    text-decoration:underline; cursor:pointer;
  }

  /* ---- 關卡（翻牌配對）畫面 ---- */
  #levelView{ display:none; width:100%; max-width:680px; flex-direction:column; align-items:center; }
  .levelHeader{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .backBtn{
    border:none; background:#fff; color:var(--purple); font-weight:700; font-size:14px;
    padding:8px 14px; border-radius:999px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.08);
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .progress{
    font-size:15px; font-weight:700; color:var(--purple);
    background:#fff; padding:8px 18px; border-radius:999px; box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .board{
    display:grid; grid-template-columns:repeat(3, minmax(125px,150px));
    gap:14px; max-width:520px; width:100%; justify-content:center;
  }
  .card{ position:relative; aspect-ratio:3/4; cursor:pointer; perspective:800px; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
  .card-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .card.flipped .card-inner, .card.matched .card-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; display:flex; align-items:center; justify-content:center; flex-direction:column; box-shadow:0 3px 10px rgba(0,0,0,.10); }
  .face-back{ background:linear-gradient(135deg,var(--purple),var(--pink)); font-size:34px; }
  .face-front{ background:var(--card); transform:rotateY(180deg); padding:8px; text-align:center; border:3px solid transparent; }
  .card.matched .face-front{ border-color:var(--green); }
  .card.wrong .card-inner{ animation:shake .4s; }
  @keyframes shake{ 0%,100%{ transform:rotateY(180deg) translateX(0); } 25%{ transform:rotateY(180deg) translateX(-6px); } 75%{ transform:rotateY(180deg) translateX(6px); } }
  .card.matched{ animation:pop .4s ease; }
  @keyframes pop{ 0%{ transform:scale(1); } 50%{ transform:scale(1.12); } 100%{ transform:scale(1); } }
  .img-face img{ width:70%; max-height:65%; object-fit:contain; }
  .word-en{ font-size:16px; font-weight:800; color:var(--purple); margin-top:2px; }
  .word-zh{ margin-top:6px; }
  .star-badge{ position:absolute; top:-8px; right:-8px; background:var(--gold); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:15px; box-shadow:0 2px 6px rgba(0,0,0,.15); transform:rotateY(180deg); display:none; }
  .letter-tag{ position:absolute; top:4px; left:6px; font-size:11px; font-weight:700; color:#fff; background:var(--purple); border-radius:6px; padding:1px 6px; opacity:.85; transform:rotateY(180deg); }

  /* ---- 收集慶祝 ---- */
  #collectOverlay, #finalOverlay{
    position:fixed; inset:0; background:rgba(45,42,69,.55); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  #collectOverlay .box, #finalOverlay .box{
    background:#fff; border-radius:24px; padding:32px 28px; text-align:center; max-width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  #collectOverlay img{ width:120px; height:120px; object-fit:contain; margin-bottom:10px; }
  #collectOverlay h2, #finalOverlay h2{ margin:8px 0 6px; color:var(--purple); }
  #collectOverlay p, #finalOverlay p{ color:var(--muted); margin:0 0 16px; }
  .btn{ padding:12px 24px; border-radius:12px; border:none; font-weight:800; font-size:15px; cursor:pointer; background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .confetti{ position:absolute; font-size:22px; animation:fall 1.6s ease-in forwards; }
  @keyframes fall{ 0%{ transform:translateY(-20px) rotate(0deg); opacity:1; } 100%{ transform:translateY(420px) rotate(360deg); opacity:0; } }

  footer{ margin-top:22px; font-size:12px; color:var(--muted); text-align:center; }
  .hubLink{ align-self:flex-start; font-size:13px; color:var(--muted); text-decoration:none; margin-bottom:8px; }

  @media (max-width:480px){
    .board{ grid-template-columns:repeat(2, minmax(130px,1fr)); max-width:340px; }
    .word-en{ font-size:15px; }
  }
</style>
</head>
<body>

<a class="hubLink" href="index.html">← 選單</a>

<h1>🗺️ 闖關收集地圖</h1>
<div class="sub">每個字母是一關，過關就能收集情境圖貼紙，集滿全部字母吧！</div>

<div id="mapView">
  <div class="mapGrid" id="mapGrid"></div>
  <div class="albumTitle">🎴 我的收集本</div>
  <div class="album" id="album"></div>
  <div style="text-align:center;"><button class="resetBtn" id="resetBtn">重新開始收集進度</button></div>
</div>

<div id="levelView">
  <div class="levelHeader">
    <button class="backBtn" id="backBtn">← 回地圖</button>
    <div class="progress">配對進度：<span id="progressText">0 / 3</span> 🌟</div>
  </div>
  <div class="board" id="board"></div>
</div>

<div id="collectOverlay">
  <div class="box">
    <img id="collectImg" src="" alt="">
    <h2>🎉 收集成功！</h2>
    <p id="collectText"></p>
    <button class="btn" id="collectContinueBtn">回地圖</button>
  </div>
</div>

<div id="finalOverlay">
  <div class="box">
    <div style="font-size:56px;">🏆</div>
    <h2>太棒了！全部收集完成！</h2>
    <p>你已經收集了目前開放的所有字母貼紙！</p>
    <button class="btn" id="finalCloseBtn">回地圖</button>
  </div>
</div>

<footer>ABC 字母 × 注音遊戲 · WG_Game</footer>

<script>
/* ---- 遊戲資料（來自 words-data.js） ---- */
var ALL_LETTERS = ABC_ALL_LETTERS;
var WORDS_BY_LETTER = ABC_WORDS_BY_LETTER;
var SCENES = ABC_SCENES;

var STORAGE_KEY = 'abc_collection_progress_v1';

function loadProgress() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { completed: [] };
  } catch (e) { return { completed: [] }; }
}
function saveProgress(progress) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
}
var progress = loadProgress();

function isAvailable(letter) { return !!WORDS_BY_LETTER[letter]; }
function isCompleted(letter) { return progress.completed.indexOf(letter) !== -1; }
function isUnlocked(letter) {
  if (!isAvailable(letter)) return false;
  var idx = ALL_LETTERS.indexOf(letter);
  if (idx === 0) return true;
  var prevLetter = ALL_LETTERS[idx - 1];
  return !isAvailable(prevLetter) || isCompleted(prevLetter) || isCompleted(letter);
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function playAudio(src, onEnded) {
  var a = new Audio(src);
  a.playbackRate = 0.9;
  if (onEnded) a.addEventListener('ended', onEnded);
  a.play().catch(function () {});
  return a;
}

/* ---- 地圖畫面 ---- */
function renderMap() {
  var grid = document.getElementById('mapGrid');
  grid.innerHTML = '';
  ALL_LETTERS.forEach(function (letter) {
    var btn = document.createElement('button');
    var completed = isCompleted(letter);
    var unlocked = isUnlocked(letter);
    var state = completed ? 'completed' : (unlocked ? 'unlocked' : 'locked');
    btn.className = 'node ' + state + (unlocked && !completed ? ' pulse' : '');
    btn.innerHTML = completed ? '✅' : (unlocked ? letter : '🔒');
    if (unlocked) {
      btn.addEventListener('click', function () { openLevel(letter); });
    }
    grid.appendChild(btn);
  });

  var album = document.getElementById('album');
  album.innerHTML = '';
  ALL_LETTERS.forEach(function (letter) {
    if (!isAvailable(letter)) return;
    var slot = document.createElement('div');
    if (isCompleted(letter)) {
      slot.className = 'albumSlot';
      slot.innerHTML = '<img src="' + SCENES[letter] + '" alt="' + letter + '">';
    } else {
      slot.className = 'albumSlot empty';
      slot.textContent = '?';
    }
    album.appendChild(slot);
  });
}

/* ---- 關卡畫面（翻牌配對，範圍縮小成單一字母的 3 個單字）---- */
var currentLetter = null;
var flipped = [];
var matchedCount = 0;
var locked = false;

function openLevel(letter) {
  currentLetter = letter;
  document.getElementById('mapView').style.display = 'none';
  document.getElementById('levelView').style.display = 'flex';
  renderLevelBoard();
}

function backToMap() {
  document.getElementById('levelView').style.display = 'none';
  document.getElementById('mapView').style.display = 'block';
  renderMap();
}

function buildDeck(words) {
  var deck = [];
  words.forEach(function (w) {
    deck.push({ kind: 'image', matchId: w.id, word: w });
    deck.push({ kind: 'word', matchId: w.id, word: w });
  });
  return shuffle(deck);
}

function makeCardEl(card) {
  var el = document.createElement('div');
  el.className = 'card';

  var inner = document.createElement('div');
  inner.className = 'card-inner';

  var back = document.createElement('div');
  back.className = 'face face-back';
  back.textContent = '❓';

  var front = document.createElement('div');
  front.className = 'face face-front';

  var tag = document.createElement('div');
  tag.className = 'letter-tag';
  tag.textContent = card.word.letter;
  front.appendChild(tag);

  if (card.kind === 'image') {
    front.classList.add('img-face');
    var img = document.createElement('img');
    img.src = card.word.img;
    img.alt = card.word.en;
    front.appendChild(img);
  } else {
    var enEl = document.createElement('div');
    enEl.className = 'word-en';
    enEl.textContent = card.word.en;
    var zhEl = document.createElement('div');
    zhEl.className = 'word-zh';
    var zy = generateZhuyinPairs(card.word.zh);
    zhEl.innerHTML = renderZhuyinText(zy.pairs, { hanziSize: 38, ratio: 0.34 });
    front.appendChild(enEl);
    front.appendChild(zhEl);
  }

  var star = document.createElement('div');
  star.className = 'star-badge';
  star.textContent = '⭐';
  front.appendChild(star);

  inner.appendChild(back);
  inner.appendChild(front);
  el.appendChild(inner);

  el.addEventListener('click', function () { onCardClick(el, card); });
  return el;
}

function renderLevelBoard() {
  var words = WORDS_BY_LETTER[currentLetter];
  var board = document.getElementById('board');
  board.innerHTML = '';
  flipped = [];
  matchedCount = 0;
  locked = false;
  document.getElementById('progressText').textContent = '0 / ' + words.length;
  var deck = buildDeck(words);
  deck.forEach(function (card) { board.appendChild(makeCardEl(card)); });
}

function onCardClick(el, card) {
  if (locked) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flipped.length === 2) return;

  el.classList.add('flipped');
  flipped.push({ el: el, card: card });

  if (flipped.length === 2) {
    locked = true;
    var a = flipped[0], b = flipped[1];
    var isMatch = a.card.matchId === b.card.matchId && a.card.kind !== b.card.kind;
    if (isMatch) {
      setTimeout(function () {
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        a.el.querySelector('.star-badge').style.display = 'flex';
        b.el.querySelector('.star-badge').style.display = 'flex';
        matchedCount++;
        var words = WORDS_BY_LETTER[currentLetter];
        document.getElementById('progressText').textContent = matchedCount + ' / ' + words.length;
        var en = playAudio('audio/words/' + a.card.word.id + '_en.mp3');
        en.addEventListener('ended', function () {
          playAudio('audio/words/' + a.card.word.id + '_zh.mp3');
        });
        flipped = [];
        locked = false;
        if (matchedCount === words.length) {
          setTimeout(function () { onLevelComplete(currentLetter); }, 900);
        }
      }, 350);
    } else {
      a.el.classList.add('wrong');
      b.el.classList.add('wrong');
      setTimeout(function () {
        a.el.classList.remove('flipped', 'wrong');
        b.el.classList.remove('flipped', 'wrong');
        flipped = [];
        locked = false;
      }, 900);
    }
  }
}

function onLevelComplete(letter) {
  if (progress.completed.indexOf(letter) === -1) {
    progress.completed.push(letter);
    saveProgress(progress);
  }
  document.getElementById('collectImg').src = SCENES[letter];
  document.getElementById('collectText').textContent = '你收集到了「' + letter + '」的情境圖貼紙！';
  var overlay = document.getElementById('collectOverlay');
  overlay.style.display = 'flex';
  spawnConfetti(overlay);
}

function spawnConfetti(overlay) {
  var emojis = ['🎉','⭐','🌈','🎈','✨'];
  for (var i = 0; i < 16; i++) {
    (function () {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = Math.random() * 100 + '%';
      c.style.top = '-20px';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      overlay.appendChild(c);
      setTimeout(function () { c.remove(); }, 2200);
    })();
  }
}

function allAvailableCompleted() {
  return ALL_LETTERS.filter(isAvailable).every(isCompleted);
}

document.getElementById('backBtn').addEventListener('click', backToMap);
document.getElementById('collectContinueBtn').addEventListener('click', function () {
  document.getElementById('collectOverlay').style.display = 'none';
  backToMap();
  if (allAvailableCompleted()) {
    setTimeout(function () { document.getElementById('finalOverlay').style.display = 'flex'; }, 300);
  }
});
document.getElementById('finalCloseBtn').addEventListener('click', function () {
  document.getElementById('finalOverlay').style.display = 'none';
});
document.getElementById('resetBtn').addEventListener('click', function () {
  progress = { completed: [] };
  saveProgress(progress);
  renderMap();
});

renderMap();
</script>
</body>
</html>
